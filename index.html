<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Air Ticket Itinerary PDF Generator - Travel Agency Studio</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- html2pdf.js & JsBarcode -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- APP NAVBAR -->
  <header class="app-header">
    <div class="brand">
      <i class="fa-solid fa-plane-departure brand-icon"></i>
      <div>
        <h1>AirTicket Pro Studio</h1>
        <p>Travel Agency Itinerary PDF Generator</p>
      </div>
    </div>
    
    <div class="actions">
      <button id="btn-load-sample" class="btn btn-secondary">
        <i class="fa-solid fa-rotate-left"></i> Load Sample Data
      </button>
      <button id="btn-clear-form" class="btn btn-ghost">
        <i class="fa-solid fa-trash-can"></i> Clear Form
      </button>

      <!-- LAYOUT TEMPLATE SELECTOR -->
      <div class="layout-picker">
        <label><i class="fa-solid fa-layer-group"></i> Template:</label>
        <select id="layout-select">
          <option value="layout-luxury" selected>💎 Luxury Executive (V3)</option>
          <option value="layout-modern">✨ Modern Airline (V2)</option>
          <option value="layout-classic">📋 Classic Table (V1)</option>
        </select>
      </div>

      <!-- THEME SELECTOR -->
      <div class="theme-picker">
        <label><i class="fa-solid fa-palette"></i> Color:</label>
        <select id="theme-select">
          <option value="theme-modern-blue" selected>Sky Blue</option>
          <option value="theme-cyan">Cyan Classic</option>
          <option value="theme-navy">Royal Indigo</option>
          <option value="theme-emerald">Emerald Gold</option>
          <option value="theme-crimson">Red Velvet</option>
        </select>
      </div>

      <button id="btn-print" class="btn btn-primary">
        <i class="fa-solid fa-print"></i> Print Ticket
      </button>
      <button id="btn-download-pdf" class="btn btn-accent">
        <i class="fa-solid fa-file-pdf"></i> Download PDF
      </button>
    </div>
  </header>

  <!-- MAIN STUDIO CONTAINER -->
  <main class="studio-container">
    
    <!-- LEFT PANEL: CONTROLS FORM -->
    <section class="editor-panel">
      
      <!-- Accordion 1: Agency Branding -->
      <div class="card accordion active">
        <div class="card-header">
          <h3><i class="fa-solid fa-building-user"></i> Agency Header Details</h3>
          <i class="fa-solid fa-chevron-down toggle-icon"></i>
        </div>
        <div class="card-body">
          <div class="form-group full-width">
            <label>Agency Logo (Image Upload / Default):</label>
            <div class="logo-upload-box">
              <input type="file" id="agency-logo-file" accept="image/*" class="file-input">
              <button type="button" class="btn btn-sm btn-secondary" onclick="document.getElementById('agency-logo-file').click()">
                <i class="fa-solid fa-upload"></i> Upload Logo
              </button>
              <button type="button" id="btn-reset-logo" class="btn btn-sm btn-ghost">
                Reset Logo
              </button>
              <span id="logo-file-name" class="file-hint">Default Tanvir Air Logo</span>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="agency-name">Business Name</label>
              <input type="text" id="agency-name" placeholder="e.g. Tanvir Air Travels">
            </div>
            <div class="form-group">
              <label for="agency-tagline">Tagline / Reg Text</label>
              <input type="text" id="agency-tagline" placeholder="e.g. -Govt. Approved Travel Agent.">
            </div>
          </div>

          <div class="form-group full-width">
            <label for="agency-address">Office Address</label>
            <textarea id="agency-address" rows="2" placeholder="Street, Market, City, Country"></textarea>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="agency-mobile1">Mobile / Phone 1</label>
              <input type="text" id="agency-mobile1" placeholder="e.g. +88 01761-953000">
            </div>
            <div class="form-group">
              <label for="agency-mobile2">Mobile / Phone 2</label>
              <input type="text" id="agency-mobile2" placeholder="e.g. +88 01304-222233">
            </div>
          </div>
        </div>
      </div>

      <!-- Accordion 2: Typography & Font Controls -->
      <div class="card accordion active">
        <div class="card-header">
          <h3><i class="fa-solid fa-text-height"></i> Typography & Font Settings</h3>
          <i class="fa-solid fa-chevron-down toggle-icon"></i>
        </div>
        <div class="card-body">
          <div class="form-row">
            <div class="form-group">
              <label for="font-header-size">Header Font Size</label>
              <select id="font-header-size">
                <option value="1.25rem">Small (1.25rem)</option>
                <option value="1.5rem" selected>Medium (1.5rem)</option>
                <option value="1.8rem">Large (1.8rem)</option>
                <option value="2.1rem">Extra Large (2.1rem)</option>
              </select>
            </div>
            <div class="form-group">
              <label for="font-header-weight">Header Weight</label>
              <select id="font-header-weight">
                <option value="500">Normal (500)</option>
                <option value="600">SemiBold (600)</option>
                <option value="700">Bold (700)</option>
                <option value="800" selected>Extra Bold (800)</option>
                <option value="900">Black (900)</option>
              </select>
            </div>
          </div>

          <div class="form-row margin-top-xs">
            <div class="form-group">
              <label for="font-body-size">Body & Table Font Size</label>
              <select id="font-body-size">
                <option value="0.7rem">Compact (0.7rem)</option>
                <option value="0.78rem" selected>Normal (0.78rem)</option>
                <option value="0.88rem">Large (0.88rem)</option>
              </select>
            </div>
            <div class="form-group">
              <label for="font-body-weight">Body & Table Weight</label>
              <select id="font-body-weight">
                <option value="400">Regular (400)</option>
                <option value="500">Medium (500)</option>
                <option value="600" selected>SemiBold (600)</option>
                <option value="700">Bold (700)</option>
              </select>
            </div>
          </div>

          <div class="form-row margin-top-xs">
            <div class="form-group">
              <label for="font-code-size">Airport Code Font Size</label>
              <select id="font-code-size">
                <option value="1.5rem">Normal (1.5rem)</option>
                <option value="1.8rem" selected>Large (1.8rem)</option>
                <option value="2.2rem">Extra Large (2.2rem)</option>
              </select>
            </div>
            <div class="form-group">
              <label for="font-code-weight">Airport Code Weight</label>
              <select id="font-code-weight">
                <option value="600">SemiBold (600)</option>
                <option value="700">Bold (700)</option>
                <option value="900" selected>Heavy Black (900)</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <!-- Accordion 3: Passenger Information -->
      <div class="card accordion active">
        <div class="card-header">
          <h3><i class="fa-solid fa-user-tag"></i> Passenger Information</h3>
          <i class="fa-solid fa-chevron-down toggle-icon"></i>
        </div>
        <div class="card-body">
          <div class="form-row">
            <div class="form-group">
              <label for="pass-name">Passenger Name</label>
              <input type="text" id="pass-name" placeholder="FULL NAME (e.g. BILAL HOSSAN)">
            </div>
            <div class="form-group">
              <label for="pass-passport">Passport Number</label>
              <input type="text" id="pass-passport" placeholder="e.g. A22042921">
            </div>
          </div>
          <div class="form-group full-width">
            <label for="pass-mobile">Mobile Number</label>
            <input type="text" id="pass-mobile" placeholder="e.g. +88 01700-000000">
          </div>
        </div>
      </div>

      <!-- Accordion 4: Booking & Ticket Details -->
      <div class="card accordion active">
        <div class="card-header">
          <h3><i class="fa-solid fa-ticket"></i> Booking & Ticket Details</h3>
          <i class="fa-solid fa-chevron-down toggle-icon"></i>
        </div>
        <div class="card-body">
          <div class="form-row">
            <div class="form-group">
              <label for="ticket-pnr">PNR Code</label>
              <input type="text" id="ticket-pnr" placeholder="e.g. PBQU7T">
            </div>
            <div class="form-group">
              <label for="ticket-number">Air Ticket Number</label>
              <input type="text" id="ticket-number" placeholder="e.g. 779-1234567890 or -">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="ticket-date">Date of Issue</label>
              <input type="text" id="ticket-date" placeholder="e.g. 25 July 2026">
            </div>
            <div class="form-group">
              <label for="ticket-checkin">Check-in Status</label>
              <input type="text" id="ticket-checkin" placeholder="e.g. Web Check-in Available">
            </div>
          </div>
        </div>
      </div>

      <!-- Accordion 5: Flight Segments -->
      <div class="card accordion active">
        <div class="card-header">
          <h3><i class="fa-solid fa-plane"></i> Flight Segments</h3>
          <i class="fa-solid fa-chevron-down toggle-icon"></i>
        </div>
        <div class="card-body">
          <div id="flight-segments-container">
            <!-- Dynamic Flight Cards Injected by JS -->
          </div>
          <button type="button" id="btn-add-segment" class="btn btn-secondary full-width margin-top">
            <i class="fa-solid fa-plus"></i> Add Another Flight Segment
          </button>
        </div>
      </div>

      <!-- Accordion 6: Footer Notes & Terms -->
      <div class="card accordion active">
        <div class="card-header">
          <h3><i class="fa-solid fa-list-check"></i> Footer Notes & Terms</h3>
          <i class="fa-solid fa-chevron-down toggle-icon"></i>
        </div>
        <div class="card-body">
          <div class="form-group full-width">
            <label for="footer-note1">Notice Line 1</label>
            <input type="text" id="footer-note1" placeholder="e.g. Please check flight timings with airline 24 hours prior to departure.">
          </div>
          <div class="form-group full-width margin-top-xs">
            <label for="footer-note2">Notice Line 2</label>
            <input type="text" id="footer-note2" placeholder="e.g. Carry valid Passport, Visa & Govt. Photo ID during entire travel.">
          </div>
          <div class="form-group full-width margin-top-xs">
            <label for="footer-note3">Notice Line 3 (Optional)</label>
            <input type="text" id="footer-note3" placeholder="e.g. For baggage policy or itinerary changes, contact agency helpline.">
          </div>
        </div>
      </div>

    </section>

    <!-- RIGHT PANEL: REAL-TIME A4 PREVIEW -->
    <section class="preview-panel">
      <div class="preview-toolbar">
        <span id="preview-mode-title"><i class="fa-solid fa-eye"></i> Ticket Preview Studio</span>
        <div class="zoom-controls">
          <button id="btn-zoom-out" title="Zoom Out"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
          <span id="zoom-level">100%</span>
          <button id="btn-zoom-in" title="Zoom In"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
          <button id="btn-zoom-reset" title="Reset Zoom"><i class="fa-solid fa-rotate"></i></button>
        </div>
      </div>

      <div class="preview-viewport">
        <!-- A4 SHEET PREVIEW -->
        <div id="ticket-document" class="a4-sheet theme-modern-blue layout-luxury">
          <!-- Dynamic Content Rendered by app.js based on selected Layout, Theme, Typography & Footer Notes -->
        </div>
      </div>

    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
